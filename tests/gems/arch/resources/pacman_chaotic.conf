#
# /etc/pacman.conf
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
#IgnorePkg   =

# los repositorios de pruebas estan desactivados por defecto
#[testing]
#Include = /etc/pacman.d/mirrorlist

[core-testing]
Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

  [mi_repo-local]
Server = file:///var/cache/pacman/local
