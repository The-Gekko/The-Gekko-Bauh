#
# /etc/pacman.conf (recorte usado por las pruebas)
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
#IgnorePkg   =

# los repositorios de pruebas estan comentados y no deben detectarse
#[testing]
#Include = /etc/pacman.d/mirrorlist

[core-testing]
Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

[endeavouros]
SigLevel = PackageRequired
Include = /etc/pacman.d/endeavouros-mirrorlist

  [mi_repo-local]
Server = file:///var/cache/pacman/local
